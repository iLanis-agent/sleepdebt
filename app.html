<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SleepDebt - your sleep is a bank account. check the balance.</title>
<style>
  :root { --bg:#12101a; --panel:#1a1726; --line:#2e2a40; --text:#f2f0fa; --dim:#a29dbd; --accent:#b39ddb; --good:#8be0a4; --warn:#ffcf7a; --bad:#ff8f7a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:26px 14px 44px; }
  h1 { font-size:30px; }
  .sub { color:var(--dim); margin:6px 0 18px; font-size:14px; text-align:center; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; width:min(600px, 94vw); margin-bottom:14px; }
  .card h2 { font-size:15px; margin-bottom:10px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  input, select { background:#100d19; border:1px solid var(--line); border-radius:8px; color:var(--text); padding:9px 12px; font-size:14px; }
  label { color:var(--dim); font-size:12px; display:block; margin-bottom:4px; }
  button { background:var(--accent); color:#12101a; border:none; border-radius:8px; padding:10px 18px; font-size:14px; font-weight:700; cursor:pointer; }
  .gauge { text-align:center; padding:6px 0 2px; }
  .gauge .num { font-size:44px; font-weight:900; }
  .gauge .chip { display:inline-block; font-size:12px; font-weight:700; padding:3px 12px; border-radius:20px; margin-top:6px; }
  .v-banked { color:var(--good); } .v-even { color:var(--good); } .v-owing { color:var(--warn); } .v-deep, .v-crisis { color:var(--bad); }
  .c-banked, .c-even { background:var(--good); color:#12101a; } .c-owing { background:var(--warn); color:#12101a; } .c-deep, .c-crisis { background:var(--bad); color:#12101a; }
  .stats { display:flex; gap:10px; margin-top:14px; }
  .stat { flex:1; background:#100d19; border:1px solid var(--line); border-radius:10px; padding:10px; text-align:center; }
  .stat .v { font-size:19px; font-weight:900; }
  .stat .k { color:var(--dim); font-size:11px; margin-top:3px; }
  .plan { background:#100d19; border-left:4px solid var(--good); border-radius:8px; padding:12px 14px; font-size:14px; line-height:1.7; margin-top:4px; }
  .chart { display:flex; align-items:flex-end; gap:4px; height:110px; margin-top:10px; }
  .col { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; }
  .col .bar { width:100%; border-radius:3px 3px 0 0; background:var(--accent); min-height:2px; }
  .col .bar.short { background:var(--bad); }
  .col .d { font-size:8px; color:var(--dim); margin-top:3px; }
  .night { display:flex; justify-content:space-between; align-items:center; background:#100d19; border:1px solid var(--line); border-radius:8px; padding:7px 12px; margin-top:6px; font-size:13px; }
  .night .rm { color:var(--dim); cursor:pointer; }
  .night .rm:hover { color:var(--bad); }
  .foot { margin-top:14px; color:var(--dim); font-size:13px; }
  a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<h1>SleepDebt</h1>
<div class="sub">every short night is a withdrawal. every long one pays it back. what's your balance?</div>

<div class="card">
  <h2>Log a night</h2>
  <div class="row">
    <div><label>Date</label><input type="date" id="n-date"></div>
    <div><label>Hours slept</label><select id="n-hours"></select></div>
    <div><label>Your target</label><select id="target"></select></div>
    <button id="add">Log it</button>
  </div>
</div>

<div class="card">
  <div class="gauge">
    <div class="num" id="debt-num">0h</div>
    <div><span class="chip" id="debt-chip">even</span></div>
  </div>
  <div class="stats">
    <div class="stat"><div class="v" id="avg">-</div><div class="k">7-day average</div></div>
    <div class="stat"><div class="v" id="streak">0</div><div class="k">target streak</div></div>
    <div class="stat"><div class="v" id="logged">0</div><div class="k">nights logged</div></div>
  </div>
  <div class="chart" id="chart"></div>
</div>

<div class="card">
  <h2>Recovery plan</h2>
  <div class="row" style="margin-bottom:10px">
    <div><label>If you sleep this much nightly</label>
      <select id="plan-hours"></select>
    </div>
  </div>
  <div class="plan" id="plan"></div>
</div>

<div class="card">
  <h2>Log</h2>
  <div id="nights"></div>
</div>

<div class="foot"><a href="index.html">&larr; about</a></div>

<script src="engine.js?v=1"></script>
<script>
(function () {
  var KEY = 'sleepdebt-v1';
  var state = { nights: [], target: 8, planNightly: 9 };

  function todayStr() {
    var n = new Date();
    return n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0') + '-' + String(n.getDate()).padStart(2,'0');
  }
  function yesterdayStr() {
    var n = new Date(); n.setDate(n.getDate() - 1);
    return n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0') + '-' + String(n.getDate()).padStart(2,'0');
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function load() { try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.nights)) state = s; } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function fillHours(sel, from, to, step, def) {
    var el = document.getElementById(sel);
    for (var h = from; h <= to + 0.001; h += step) {
      var v = Math.round(h * 10) / 10;
      var o = document.createElement('option');
      o.value = v;
      o.textContent = v + 'h';
      if (Math.abs(v - def) < 0.001) o.selected = true;
      el.appendChild(o);
    }
  }
  fillHours('n-hours', 0, 14, 0.5, 7.5);
  fillHours('target', 6, 10, 0.5, 8);
  fillHours('plan-hours', 7, 11, 0.5, 9);

  var VLABEL = { banked: 'banked surplus', even: 'even', owing: 'owing sleep', deep: 'deep in debt', crisis: 'CRISIS' };

  function render() {
    var target = state.target;
    var d = SleepDebt.debt(state.nights, target);
    var v = SleepDebt.verdict(d);
    var num = document.getElementById('debt-num');
    num.textContent = (d > 0 ? '' : '+') + (-d).toFixed(1).replace(/\.0$/, '') + 'h';
    num.textContent = d > 0 ? '-' + d.toFixed(1).replace(/\.0$/, '') + 'h' : (d < 0 ? '+' + Math.abs(d).toFixed(1).replace(/\.0$/, '') + 'h' : '0h');
    num.className = 'num v-' + v;
    var chip = document.getElementById('debt-chip');
    chip.textContent = VLABEL[v];
    chip.className = 'chip c-' + v;

    var avg = SleepDebt.weeklyAvg(state.nights, todayStr());
    document.getElementById('avg').textContent = avg === null ? '-' : avg + 'h';
    document.getElementById('streak').textContent = SleepDebt.streak(state.nights, target, todayStr());
    document.getElementById('logged').textContent = state.nights.length;

    // chart: last 14 nights
    var chart = document.getElementById('chart');
    chart.innerHTML = '';
    var sorted = state.nights.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    sorted.slice(-14).forEach(function (n) {
      var col = document.createElement('div');
      col.className = 'col';
      var hPct = Math.min(100, n.hours / 12 * 100);
      col.innerHTML = '<div class="bar' + (n.hours < target ? ' short' : '') + '" style="height:' + hPct + '%" title="' + n.hours + 'h"></div><div class="d">' + n.date.slice(8) + '</div>';
      chart.appendChild(col);
    });

    // plan
    var plan = document.getElementById('plan');
    if (d <= 0) {
      plan.innerHTML = d < 0
        ? 'You are <b>' + Math.abs(d).toFixed(1) + 'h ahead</b>. Guard the surplus - one all-nighter burns about ' + target + 'h of it.'
        : 'Balance is zero. Tonight decides which way it tips.';
    } else {
      var p = SleepDebt.recoveryPlan(d, target, state.planNightly, todayStr());
      plan.innerHTML = 'Sleep <b>' + state.planNightly + 'h</b> a night (+' + p.surplusPerNight + 'h over target) and your <b>' + d.toFixed(1) + 'h</b> debt clears in <b>' + p.nights + ' night' + (p.nights === 1 ? '' : 's') + '</b> - by <b>' + p.clearBy + '</b>. One weekend lie-in will not do it; spread it out.';
    }

    // log list
    var el = document.getElementById('nights');
    el.innerHTML = '';
    sorted.slice().reverse().forEach(function (n) {
      var row = document.createElement('div');
      row.className = 'night';
      row.innerHTML = '<span>' + n.date + ' - <b>' + n.hours + 'h</b>' + (n.hours < target ? ' <span style="color:var(--bad)">-' + (target - n.hours).toFixed(1) + '</span>' : ' <span style="color:var(--good)">+' + (n.hours - target).toFixed(1) + '</span>') + '</span><span class="rm" data-d="' + n.date + '">remove</span>';
      el.appendChild(row);
    });
    el.querySelectorAll('.rm').forEach(function (x) {
      x.addEventListener('click', function () {
        state.nights = state.nights.filter(function (n) { return n.date !== x.getAttribute('data-d'); });
        save(); render();
      });
    });
  }

  document.getElementById('add').addEventListener('click', function () {
    var date = document.getElementById('n-date').value;
    var hours = parseFloat(document.getElementById('n-hours').value);
    if (!date || !(hours >= 0)) return;
    state.nights = state.nights.filter(function (n) { return n.date !== date; });
    state.nights.push({ date: date, hours: hours });
    save(); render();
  });
  document.getElementById('target').addEventListener('change', function () {
    state.target = parseFloat(this.value);
    save(); render();
  });
  document.getElementById('plan-hours').addEventListener('change', function () {
    state.planNightly = parseFloat(this.value);
    save(); render();
  });

  document.getElementById('n-date').value = yesterdayStr();

  // test hook
  window.__sd = {
    clear: function () { state = { nights: [], target: 8, planNightly: 9 }; save(); render(); },
    set: function (nights, target, planNightly) {
      state.nights = nights.slice();
      state.target = target || 8;
      state.planNightly = planNightly || 9;
      save(); render();
    },
    read: function () {
      return {
        debt: document.getElementById('debt-num').textContent,
        chip: document.getElementById('debt-chip').textContent,
        avg: document.getElementById('avg').textContent,
        streak: document.getElementById('streak').textContent,
        plan: document.getElementById('plan').textContent,
        bars: document.querySelectorAll('#chart .col').length,
        shortBars: document.querySelectorAll('#chart .bar.short').length
      };
    }
  };

  load();
  document.getElementById('target').value = String(state.target || 8);
  document.getElementById('plan-hours').value = String(state.planNightly || 9);
  render();
})();
</script>
</body>
</html>
